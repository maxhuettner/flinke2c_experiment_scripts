################################################################################
# Basic standalone Flink config for the coordinator (JobManager)
################################################################################

# Bind the JobManager everywhere but advertise localhost; adjust if workers run elsewhere
jobmanager.bind-host: 0.0.0.0
jobmanager.rpc.address: localhost
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 8G

# Workers mostly read memory from their own config, but Flink wants a default here
taskmanager.memory.process.size: 8G
# taskmanager.numberOfTaskSlots: 1

parallelism.default: 1
io.tmp.dirs: /tmp

rest.address: 0.0.0.0
rest.bind-address: 0.0.0.0
rest.port: 8081

# Where the example topology lives inside the image
# Replace if you keep the graph outside and mount it instead
# (for now it uses the one bundled in containers/flink/conf)
topology.graphml.path: /opt/flink/conf/cloud.graphml

#===============================================================================
# JVM
#===============================================================================

env.java.opts: -verbose:gc -XX:NewRatio=3 -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:ParallelGCThreads=4
env.java.opts.jobmanager: -Xloggc:$FLINK_LOG_DIR/jobmanager-gc.log -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=2 -XX:GCLogFileSize=512M
env.java.opts.taskmanager: -Xloggc:$FLINK_LOG_DIR/taskmanager-gc.log -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=2 -XX:GCLogFileSize=512M

#===============================================================================
# State & Checkpoint
#===============================================================================

state.backend: rocksdb
state.checkpoints.dir: file:///tmp/flink-checkpoints
state.backend.rocksdb.localdir: /tmp
state.backend.incremental: true
execution.checkpointing.interval: 180000
execution.checkpointing.mode: EXACTLY_ONCE
state.backend.local-recovery: true

#===============================================================================
# Runtime
#===============================================================================

table.exec.mini-batch.enabled: true
table.exec.mini-batch.allow-latency: 2s
table.exec.mini-batch.size: 50000
table.optimizer.distinct-agg.split.enabled: true
execution.checkpointing.checkpoints-after-tasks-finish.enabled: false
