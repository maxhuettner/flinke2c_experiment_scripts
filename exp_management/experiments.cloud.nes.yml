# Example experiment batch definition for `sim experiment`.
#
# Usage:
#   sim experiment \
#     -f config/topologies/edge-to-cloud.json \
#     -e exp_management/experiments.example.yml \
#     -o results/
#
# Top-level fields:
#   repetitions       - global default repetitions for all experiments (optional)
#
# Fields per experiment:
#   name              - identifier; also used as the log output subdirectory
#   system            - streaming system to use (currently only "flink")
#   query             - query name, resolves to exp_management/queries/flink/<name>.sql
#   repetitions       - per-experiment override (defaults to top-level repetitions or 1)
#   placement_method  - "" (default) or e.g. "TOP_DOWN". For system: flink, enables
#                       topology-aware placement (graphml). For system: nes, selects
#                       the NES placement strategy (TOP_DOWN, BOTTOM_UP, IFCOP, ILP,
#                       ML_HEURISTIC, ELEGANT_PERFORMANCE/ENERGY/BALANCED); unset
#                       defaults to NES's own TopDown strategy.
#   graphml_file      - graphml filename in exp_management/configs/flink/coordinator/
#                       (optional; defaults to <topology-stem>.graphml when placement_method is set)
#   num_task_slots    - override the task slot count from query_config.yml (optional)
#   nes_num_slots     - override NES worker numberOfSlots (system: nes only).
#                       Unset: workers default to unlimited.
#   nes_coordinator_num_slots
#                     - override NES coordinator numberOfSlots (system: nes
#                       only). Defaults to 1.
#   flink_rocksdb     - state.backend: rocksdb (system: flink only). Default (unset)
#                       is on. Off relies purely on the instance-type-sized heap
#                       (see _flink_process_memory_mb) instead of RocksDB's
#                       off-heap/disk storage to survive q4's 24h-window state.
#
# Per-query extra arguments (e.g. --num-events, num_task_slots) are read from
# exp_management/configs/flink/query_config.yml and can be overridden here.

repetitions: 3
flink_rocksdb: false  # testing: now that taskmanager memory is sized from the
                      # real instance type instead of a flat 1728m, check
                      # whether that alone is enough for q4 without RocksDB's
                      # per-access overhead.

experiments:
