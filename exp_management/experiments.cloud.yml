# Example experiment batch definition for `sim experiment`.
repetitions: 10

experiments:
  # ── q1 ──────────────────────────────────────────────────────────────────
  - name: flink_q1_cloud
    system: flink
    query: q1

  - name: flink_det_q1_cloud
    system: flink
    placement_method: DETERMINISTIC
    query: q1

  - name: flinke2c_td_q1_cloud
    system: flink
    query: q1
    placement_method: TOP_DOWN
    graphml_file: cloud.graphml

  - name: flinke2c_bu_q1_cloud
    system: flink
    query: q1
    placement_method: BOTTOM_UP
    graphml_file: cloud.graphml

  - name: capsys_q1_cloud
    system: flink
    placement_method: CAPSYS
    query: q1

