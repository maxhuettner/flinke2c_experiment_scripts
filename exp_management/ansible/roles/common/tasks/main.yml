- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    lock_timeout: 300
  when: common_refresh_apt_cache | default(false) | bool

- name: Read local short hostname
  ansible.builtin.command: hostname -s
  register: common_short_hostname
  changed_when: false

- name: Ensure local hostname resolves via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^127\\.0\\.1\\.1\\s+"
    line: "127.0.1.1 {{ common_short_hostname.stdout }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Install Ubuntu repository helper packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 86400
    lock_timeout: 300
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Enable Ubuntu universe repository
  ansible.builtin.command: add-apt-repository -y universe
  register: common_add_universe
  changed_when: "'Adding component(s)' in (common_add_universe.stdout | default(''))"
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
    lock_timeout: 300
  when: common_base_packages | length > 0

- name: Check Python pip availability
  ansible.builtin.command: python3 -m pip --version
  register: common_python_pip_check
  changed_when: false

- name: Fail when Python pip is unavailable
  ansible.builtin.fail:
    msg: >-
      Python pip must be installed on {{ inventory_hostname }}, but
      `python3 -m pip --version` failed after package installation.
  when: common_python_pip_check.rc != 0

- name: Ensure latency tools directory exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/sim-tools"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    mode: "0755"
  when:
    - (hostvars[inventory_hostname].node_type | default('') | lower) == 'sink'

- name: Create latency Python virtualenv
  ansible.builtin.command:
    cmd: "python3 -m venv /home/{{ ansible_user | default('ubuntu') }}/sim-tools/latency-venv"
    creates: "/home/{{ ansible_user | default('ubuntu') }}/sim-tools/latency-venv/bin/python"
  when:
    - (hostvars[inventory_hostname].node_type | default('') | lower) == 'sink'

- name: Ensure latency Python virtualenv ownership
  ansible.builtin.file:
    path: "/home/{{ ansible_user | default('ubuntu') }}/sim-tools/latency-venv"
    state: directory
    owner: "{{ ansible_user | default('ubuntu') }}"
    group: "{{ ansible_user | default('ubuntu') }}"
    recurse: true
  when:
    - (hostvars[inventory_hostname].node_type | default('') | lower) == 'sink'

- name: Install latency preprocessing Python packages
  ansible.builtin.pip:
    name: "{{ latency_python_packages }}"
    state: present
    virtualenv: "/home/{{ ansible_user | default('ubuntu') }}/sim-tools/latency-venv"
    virtualenv_command: "python3 -m venv"
  when:
    - (hostvars[inventory_hostname].node_type | default('') | lower) == 'sink'

- name: Check Docker CLI availability
  ansible.builtin.command: docker --version
  register: docker_check_initial
  failed_when: false
  changed_when: false

- name: Install Docker engine
  ansible.builtin.apt:
    name:
      - "{{ docker_package_name | default('docker.io') }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
    lock_timeout: 300
  register: docker_install_result
  when:
    - node_class is defined
    - node_class == 'cloud'
    - docker_check_initial.rc != 0

- name: Re-check Docker CLI after installation
  ansible.builtin.command: docker --version
  register: docker_check_after_install
  changed_when: false
  when:
    - node_class is defined
    - node_class == 'cloud'
    - docker_check_initial.rc != 0

- name: Ensure Docker service is enabled on cloud nodes
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - node_class is defined
    - node_class == 'cloud'
    - docker_check_initial.rc == 0 or (docker_check_after_install is defined and docker_check_after_install.rc == 0)

- name: Re-check Docker CLI availability
  ansible.builtin.command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Add ansible user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user | default('mhuttner') }}"
    groups: docker
    append: true
  when: docker_check.rc == 0

- name: Resolve node-specific Docker images to pre-pull
  ansible.builtin.set_fact:
    docker_images_to_pull: >-
      {{
        docker_images_by_node_type.get(
          (hostvars[inventory_hostname].node_type | default('') | lower),
          []
        ) | unique
      }}

- name: Fail when Docker images are requested but Docker is unavailable
  ansible.builtin.fail:
    msg: >-
      Docker is required on {{ inventory_hostname }} (node_type={{ hostvars[inventory_hostname].node_type | default('unknown') }})
      to pre-pull images {{ docker_images_to_pull }}, but 'docker' CLI is not available.
      For on-prem nodes, install Docker manually or set node_type to skip image pulls.
  when:
    - docker_images_to_pull | length > 0
    - docker_check.rc != 0

- name: Prune unused Docker objects to free disk space before pulling
  ansible.builtin.command: docker system prune -f
  when:
    - docker_images_to_pull | length > 0
    - docker_check.rc == 0
    - docker_prune_before_pull | default(false)

- name: Pre-pull node-specific Docker images (always refresh tags)
  ansible.builtin.command: "docker pull {{ image }}"
  loop: "{{ docker_images_to_pull }}"
  loop_control:
    loop_var: image
  failed_when: false
  changed_when: false
  when:
    - docker_images_to_pull | length > 0
    - docker_check.rc == 0
    - docker_pull_always | default(true)

- name: Check which node-specific Docker images are already present
  ansible.builtin.command: "docker image inspect {{ image }}"
  loop: "{{ docker_images_to_pull }}"
  loop_control:
    loop_var: image
  register: docker_image_inspect_results
  failed_when: false
  changed_when: false
  when:
    - docker_images_to_pull | length > 0
    - docker_check.rc == 0
    - not (docker_pull_always | default(true))

- name: Build list of missing Docker images
  ansible.builtin.set_fact:
    docker_images_missing: >-
      {{
        (docker_image_inspect_results.results | default([]))
        | rejectattr('rc', 'equalto', 0)
        | map(attribute='image')
        | list
      }}
  when:
    - docker_images_to_pull | length > 0
    - docker_check.rc == 0
    - not (docker_pull_always | default(true))

- name: Pre-pull missing node-specific Docker images
  ansible.builtin.command: "docker pull {{ image }}"
  loop: "{{ docker_images_missing | default([]) }}"
  loop_control:
    loop_var: image
  when:
    - (docker_images_missing | default([])) | length > 0
    - docker_check.rc == 0
    - not (docker_pull_always | default(true))

- name: Install cloud specific apt packages (excluding awscli fallback package)
  ansible.builtin.apt:
    name: "{{ common_cloud_apt_packages }}"
    state: present
  vars:
    common_cloud_apt_packages: "{{ common_cloud_packages | difference(['awscli']) }}"
  when:
    - node_class is defined
    - node_class == 'cloud'
    - common_cloud_apt_packages | length > 0

- name: Install awscli from apt when requested
  ansible.builtin.apt:
    name: awscli
    state: present
  register: awscli_apt_result
  failed_when: false
  when:
    - node_class is defined
    - node_class == 'cloud'
    - "'awscli' in common_cloud_packages"

- name: Install awscli via pip when apt package is unavailable
  ansible.builtin.pip:
    name: awscli
    state: present
    executable: pip3
  when:
    - node_class is defined
    - node_class == 'cloud'
    - "'awscli' in common_cloud_packages"
    - awscli_apt_result is failed
    - common_python_pip_check.rc == 0

- name: Fail when awscli requires pip but Python pip is unavailable
  ansible.builtin.fail:
    msg: >-
      awscli apt installation was unavailable on {{ inventory_hostname }}, and Python pip
      is also unavailable. apt stderr: {{ awscli_apt_result.stderr | default('') | trim }}
  when:
    - node_class is defined
    - node_class == 'cloud'
    - "'awscli' in common_cloud_packages"
    - awscli_apt_result is failed
    - common_python_pip_check.rc != 0

- name: Install on-prem specific packages
  ansible.builtin.apt:
    name: "{{ common_onprem_packages }}"
    state: present
  when:
    - node_class is defined
    - node_class == 'onprem'
    - common_onprem_packages | length > 0
