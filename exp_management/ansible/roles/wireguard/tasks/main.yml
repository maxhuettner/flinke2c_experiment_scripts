---
- name: Skip WireGuard configuration when metadata is missing
  ansible.builtin.debug:
    msg: "WireGuard metadata not provided for {{ inventory_hostname }}, skipping."
  when: wireguard is not defined
  tags: ['wireguard']

- name: Configure WireGuard
  when: wireguard is defined
  tags: ['wireguard']
  block:
    - name: Install WireGuard packages
      ansible.builtin.package:
        name: "{{ wireguard_package_map.get(ansible_distribution, wireguard_package_map.get(ansible_os_family, 'wireguard')) }}"
        state: present

    # -----------------------------------------------------------------------
    # IP forwarding — required so intermediate nodes can forward packets
    # between peers that are not directly adjacent in the WireGuard overlay.
    # Without this the kernel drops any packet whose destination is not the
    # node's own WireGuard address, silently breaking all multi-hop paths.
    # -----------------------------------------------------------------------
    - name: Enable IPv4 forwarding (persistent via sysctl.d)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-wireguard-forward.conf
        content: "net.ipv4.ip_forward = 1\n"
        owner: root
        group: root
        mode: "0644"
      register: _sysctl_file

    - name: Apply IPv4 forwarding sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-wireguard-forward.conf
      when: _sysctl_file is changed
      changed_when: true

    - name: Ensure configuration directory exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Render WireGuard configuration
      ansible.builtin.template:
        src: wg.conf.j2
        dest: "/etc/wireguard/{{ wireguard.interface | default(wireguard_interface_default) }}.conf"
        owner: root
        group: root
        mode: "0600"
      notify: Restart WireGuard

    - name: Enable WireGuard service
      ansible.builtin.service:
        name: "wg-quick@{{ wireguard.interface | default(wireguard_interface_default) }}"
        enabled: true
        state: started

    # -----------------------------------------------------------------------
    # FORWARD chain rules — managed by Ansible rather than wg-quick PostUp so
    # that iptables is not called from inside the service start, which blocks
    # indefinitely on fresh Ubuntu 22.04 (netfilter module init races).
    # -----------------------------------------------------------------------
    - name: Allow forwarding through WireGuard interface (inbound)
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wireguard.interface | default(wireguard_interface_default) }}"
        jump: ACCEPT
        state: present

    - name: Allow forwarding through WireGuard interface (outbound)
      ansible.builtin.iptables:
        chain: FORWARD
        out_interface: "{{ wireguard.interface | default(wireguard_interface_default) }}"
        jump: ACCEPT
        state: present
