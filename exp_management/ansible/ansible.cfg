[defaults]
inventory = inventory/generated_hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Use the built-in default callback; enables compatibility with Ansible >= 2.13.
stdout_callback = default
timeout = 60

[ssh_connection]
pipelining = True
control_path = ~/.ansible/cp/ansible-ssh-%%h-%%p-%%r
