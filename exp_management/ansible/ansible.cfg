[defaults]
inventory = inventory/generated_hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Use the built-in default callback; enables compatibility with Ansible >= 2.13.
stdout_callback = default
timeout = 60
inject_facts_as_vars = False
force_handlers = True
# Higher parallelism helps when provisioning multiple cloud/on-prem hosts.
forks = 20

[ssh_connection]
pipelining = True
# Keep control sockets in /tmp to avoid home-dir permission/path issues.
control_path_dir = /tmp/.ansible/cp
# Make connection reuse explicit so each task does not renegotiate SSH.
ssh_args = -F /dev/null -o ProxyCommand=none -o ProxyJump=none -o ControlMaster=auto -o ControlPersist=45m -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o BatchMode=yes -o GSSAPIAuthentication=no -o KbdInteractiveAuthentication=no -o PasswordAuthentication=no -o ConnectionAttempts=1 -o ConnectTimeout=10
retries = 1
transfer_method = piped
