---
# Packages installed on every node
common_base_packages:
  - curl
  - git
  - python3
  - python3-pip
  - python3-venv

# Extra packages per node class (set node_class host var)
common_cloud_packages:
  - awscli
common_onprem_packages: []

# Ubuntu is used across cloud and on-prem nodes in this project.
docker_package_name: docker.io
wireguard_package_name: wireguard

# Apt metadata refresh can take tens of seconds; keep reruns fast by default.
common_refresh_apt_cache: false

docker_package_map:
  Debian: docker.io
  Ubuntu: docker.io
  RedHat: docker

docker_images_by_node_type:
  source:
    - maxhue/tcp-streaming
  sink:
    - maxhue/tcp-streaming
    - maxhue/nes-coordinator
    - maxhue/flinke2c
    - prom/prometheus:latest
  compute:
    - maxhue/flinke2c
    - maxhue/nes-worker

# Refresh configured images on every setup run so reused tags (e.g. latest) are
# up to date across cloud/on-prem nodes.
docker_pull_always: true

# Pruning can be very slow on cloud nodes; keep disabled by default.
docker_prune_before_pull: false

latency_python_packages:
  - numpy
  - polars

wireguard_package_map:
  Debian: wireguard
  Ubuntu: wireguard
  RedHat: wireguard-tools

wireguard_interface: wg0
wireguard_default_listen_port: 51820
# Auto-MTU on EC2 ENA (9001) can pick very large WireGuard MTUs and cause
# PMTU blackholes across internet/NAT paths. Use a conservative default.
wireguard_default_mtu: 1420
