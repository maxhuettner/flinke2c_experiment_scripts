---
- name: Prepare experiment infrastructure (cloud + on-prem)
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    ansible_python_interpreter: /usr/bin/python3
    node_class: "{{ hostvars[inventory_hostname].node_class | default('cloud') }}"
  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 300
    - name: Bootstrap Python/Apt runtime on Debian-family hosts
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o DPkg::Lock::Timeout=300 update -y
          apt-get -o DPkg::Lock::Timeout=300 install -y python3 python3-apt python3-cffi-backend python3-cryptography
          if ! /usr/bin/python3 -c "import _cffi_backend, cryptography" >/dev/null 2>&1; then
            apt-get -o DPkg::Lock::Timeout=300 install -y --reinstall python3-cffi-backend python3-cryptography
            /usr/bin/python3 -c "import _cffi_backend, cryptography"
          fi
        fi
      changed_when: false
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: common
    - role: wireguard
