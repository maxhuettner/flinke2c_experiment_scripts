[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-sim-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14",
    "bcrypt>=4.0",
    "cryptography>=42",
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.scripts]
sim = "cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
